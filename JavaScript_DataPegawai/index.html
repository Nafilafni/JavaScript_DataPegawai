<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tugas 2 - Java Script</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #000; padding: 6px 10px; }
  </style>
</head>
<body>

<h2>Data Pegawai</h2>
<script>

  // Data pegawai
  let nama = "Dodi Prayodi";
  let umur = 25;
  let jabatan = "Manajer";
  let status = "Menikah";

  // Gaji pokok (if)
  let gapok;
  
  if (jabatan == "Manajer") {
     gapok = 15000000;
  } else if (jabatan == "Asisten Manajer") {
     gapok = 10000000;
  } else if (jabatan == "Staff") {
      gapok = 5000000;
  }

  // Tunjangan jabatan 15%
  let tunjJabatan = gapok * 15 / 100;

  // BPJS 10%
  let bpjs = gapok * 10 / 100;

  // Tunjangan keluarga 20% menggunakan ternary
  let tunjKeluarga = (status == "Menikah") ? gapok * 20 / 100 : 0;

  // Total gaji
  let total = gapok + tunjJabatan + bpjs + tunjKeluarga;

  // Cetak tabel
  document.write("<table>");

  document.write("<thead><tr>");
  document.write("<th>Nama Pegawai</th>");
  document.write("<th>Umur</th>");
  document.write("<th>Jabatan</th>");
  document.write("<th>Status</th>");
  document.write("<th>Gaji Pokok</th>");
  document.write("<th>Tunjangan Jabatan (15%)</th>");
  document.write("<th>BPJS (10%)</th>");
  document.write("<th>Tunjangan Keluarga (20%)</th>");
  document.write("</tr></thead>");

  document.write("<tbody><tr>");
  document.write("<td>" + nama + "</td>");
  document.write("<td>" + umur + " tahun</td>");
  document.write("<td>" + jabatan + "</td>");
  document.write("<td>" + status + "</td>");
  document.write("<td>Rp " + gapok.toLocaleString("id-ID") + "</td>");
  document.write("<td>Rp " + tunjJabatan.toLocaleString("id-ID") + "</td>");
  document.write("<td>Rp " + bpjs.toLocaleString("id-ID") + "</td>");
  document.write("<td>Rp " + tunjKeluarga.toLocaleString("id-ID") + "</td>");
  document.write("</tr></tbody>");

  document.write("<tfoot><tr>");
  document.write("<th colspan='7'>Total Gaji</th>");
  document.write("<th>Rp " + total.toLocaleString("id-ID") + "</th>");
  document.write("</tr></tfoot>");

  document.write("</table>");
</script>
</body>
</html>
